# Render Blueprint — deploy this repo on Render.
#
# Option A) Blueprint (recommended): dashboard -> New -> Blueprint, connect this
#   repo, fill in the prompted secrets, click Apply. Every push to the branch
#   auto-deploys.
# Option B) Manual: dashboard -> New -> Web Service, point at this repo, and use
#   the buildCommand / startCommand / healthCheckPath / envVars below.
#
# Match your Abasthan service: same env var names, same build + start commands,
# so one repo serves both hosts. Leave the Redis vars unset here (memory mode)
# unless you later run multiple instances on a paid plan.

services:
  - type: web
    name: cryo-chat
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Pinned Node LTS (also see the top-level .node-version file).
      - key: NODE_VERSION
        value: "22.12.0"
      # Optional tuning (matches .env.example defaults).
      - key: RESERVED_ROOM_CODE
        value: "9999"
      # Secrets: sync: false means they are entered in the Render dashboard and
      # never committed. Use the same values you set on Abasthan so both hosts
      # behave identically. ADMIN_KEY empty => /admin API disabled.
      - key: GIPHY_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: ADMIN_KEY
        sync: false